<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Fonts are self-hosted; src/styles/fonts.css carries the reasoning, and
         this comment ships on all 26 routes so it stays short.

         @font-face rides our own CSS bundle now, so these preloads are what keep
         the font bytes on the preload scanner's radar instead of a round trip
         behind that CSS. Only the two latin files that paint above the fold on
         every route -- latin-ext and the italic are left to unicode-range to
         fetch on demand. `crossorigin` is required even same-origin: font
         requests are CORS-mode, and without it the preload is discarded and the
         file fetched twice. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/space-grotesk-latin.woff2"
      crossorigin
    />
    <title data-rh="true">Pratik Patel — CTO & Chief Architect</title>
    <meta data-rh="true" name="description" content="Pratik Patel — Technology executive, CTO, and 3x company builder with 11+ years scaling engineering orgs across AI, Cloud, and Web3." />
    <meta name="author" content="Pratik Patel" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Pratik Patel" href="https://pratik.pa.tel/rss.xml" />
    <meta name="theme-color" content="#00ff88" />
    <!-- Default OG/Twitter tags (overridden per-page by React Helmet) -->
    <meta data-rh="true" property="og:title" content="Pratik Patel — CTO & Chief Architect" />
    <meta data-rh="true" property="og:description" content="Technology executive, CTO, and 3x company builder with 11+ years scaling engineering orgs across AI, Cloud, and Web3." />
    <meta data-rh="true" property="og:image" content="https://pratik.pa.tel/images/social-card.png" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:url" content="https://pratik.pa.tel/" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Pratik Patel" />
    <meta data-rh="true" property="og:locale" content="en_US" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Pratik Patel — CTO & Chief Architect" />
    <meta data-rh="true" name="twitter:description" content="Technology executive, CTO, and 3x company builder with 11+ years scaling engineering orgs across AI, Cloud, and Web3." />
    <meta data-rh="true" name="twitter:image" content="https://pratik.pa.tel/images/social-card.png" />
    <meta data-rh="true" name="twitter:site" content="@prpatel05" />
  </head>

  <body>
    <div id="root"></div>
    <!--
      Ctrl+K opens the terminal, but the handler that does it lives in a React
      effect, so it cannot bind until the bundle has downloaded, parsed and
      hydrated. Every route is prerendered, so the page is painted and readable
      long before that — on a slow connection, seconds before. A visitor who
      hits the shortcut in that window gets nothing, and worse: with no
      preventDefault bound yet the keystroke falls through to the browser, which
      takes Ctrl+K for its own search bar. The shortcut is advertised on the
      toggle button that is already on screen, so the window is real.

      This stand-in binds at parse time — ahead of the module script, which is
      deferred — and does the one thing that must not wait: swallow the key and
      remember it. React claims the press on mount and retires the stand-in, so
      only ever one handler is live.

      Inline and unbundled on purpose: anything imported from `src/` arrives in
      the very bundle whose download this exists to cover.

      Only the home route mounts the terminal, but this file is the shell for
      every route, so the stand-in first checks that the page it landed on
      actually has a terminal to open. Without that check it would bind on
      /blog, /404 and the rest, where nothing ever mounts to claim it, and go on
      swallowing Ctrl+K for the life of the page — leaving the shortcut worse off
      than the gap it exists to close. The prerendered markup is already in the
      DOM above, so the toggle is a reliable tell at this point.
    -->
    <script>
      (function () {
        var armed = !!document.querySelector('button[title="Open terminal (Ctrl+K)"]');
        var pending = false;

        function onKeyDown(e) {
          if ((e.metaKey || e.ctrlKey) && e.key === "k") {
            e.preventDefault();
            pending = true;
          }
        }

        if (armed) window.addEventListener("keydown", onKeyDown);

        // Published either way, so "this script has run" is observable on every
        // route — on the unarmed ones that is the only way to tell the guard
        // apart from a page that simply has not parsed this far yet.
        window.__terminalBoot = {
          armed: armed,
          claim: function () {
            if (armed) window.removeEventListener("keydown", onKeyDown);
            window.__terminalBoot = undefined;
            return pending;
          },
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
