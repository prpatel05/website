<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Fonts: linked here, not @import-ed from index.css, so the preload scanner
         starts them in parallel with our own CSS instead of one round trip later.

         Request exactly the faces the site paints, and no others. Measured, not
         grepped: e2e/font-faces.spec.ts walks every route plus the overlay states
         and asserts the rendered (family, weight, style) set is a subset of what
         this URL declares. Grepping source for weight classes gets it wrong --
         it misses italic-400, which no stylesheet here declares and the UA
         stylesheet paints on every <em> in a post.

         Widening this back out is not free: asking for a weight RANGE makes
         Google serve a variable font covering it, so an unused weight costs
         binary bytes on top of the ~1KB of extra @font-face rules in a stylesheet
         that blocks render. The 12-face request this replaced cost 30KB/route. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@700&display=swap"
    />

  </head>

  <body>
    <div id="root"></div>
    <!--
      Ctrl+K opens the terminal, but the handler that does it lives in a React
      effect, so it cannot bind until the bundle has downloaded, parsed and
      hydrated. Every route is prerendered, so the page is painted and readable
      long before that — on a slow connection, seconds before. A visitor who
      hits the shortcut in that window gets nothing, and worse: with no
      preventDefault bound yet the keystroke falls through to the browser, which
      takes Ctrl+K for its own search bar. The shortcut is advertised on the
      toggle button that is already on screen, so the window is real.

      This stand-in binds at parse time — ahead of the module script, which is
      deferred — and does the one thing that must not wait: swallow the key and
      remember it. React claims the press on mount and retires the stand-in, so
      only ever one handler is live.

      Inline and unbundled on purpose: anything imported from `src/` arrives in
      the very bundle whose download this exists to cover.

      Only the home route mounts the terminal, but this file is the shell for
      every route, so the stand-in first checks that the page it landed on
      actually has a terminal to open. Without that check it would bind on
      /blog, /404 and the rest, where nothing ever mounts to claim it, and go on
      swallowing Ctrl+K for the life of the page — leaving the shortcut worse off
      than the gap it exists to close. The prerendered markup is already in the
      DOM above, so the toggle is a reliable tell at this point.

      The same reasoning applies to a bundle that never arrives at all, which is
      the other way nothing ever claims the stand-in: a chunk 404'd by a deploy,
      a connection that drops mid-download. So it also gives up on its own after
      DISARM_AFTER_MS and hands the shortcut back to the browser.
    -->
    <script>
      (function () {
        var armed = !!document.querySelector('button[title="Open terminal (Ctrl+K)"]');
        var pending = false;

        /*
          The stand-in exists to cover one bundle download. Ten seconds is well
          past a slow one, and a bundle that has not landed by then is not
          landing — nothing is left to call claim(), so without this the key is
          swallowed for the life of the page with no terminal it could ever
          open. Long rather than tight on purpose: cutting a real download short
          would reopen the gap this script is here to close, and the cost of
          waiting is that the browser's own Ctrl+K stays unavailable a few
          seconds longer on a load that is already failing.
        */
        var DISARM_AFTER_MS = 10000;

        function onKeyDown(e) {
          if ((e.metaKey || e.ctrlKey) && e.key === "k") {
            e.preventDefault();
            pending = true;
          }
        }

        function disarm() {
          if (!armed) return;
          armed = false;
          // Dropped along with the handler: a press made before the bundle gave
          // up should not open a terminal minutes later if one somehow arrives.
          pending = false;
          window.removeEventListener("keydown", onKeyDown);
        }

        if (armed) {
          window.addEventListener("keydown", onKeyDown);
          setTimeout(disarm, DISARM_AFTER_MS);
        }

        // Published either way, so "this script has run" is observable on every
        // route — on the unarmed ones that is the only way to tell the guard
        // apart from a page that simply has not parsed this far yet.
        window.__terminalBoot = {
          // A getter, not a copy: `armed` is the live answer to "is Ctrl+K
          // still being swallowed", and after a disarm a copy would say yes
          // when the handler is gone.
          get armed() {
            return armed;
          },
          claim: function () {
            if (armed) window.removeEventListener("keydown", onKeyDown);
            window.__terminalBoot = undefined;
            return pending;
          },
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
