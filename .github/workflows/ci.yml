# CI workflow for pull requests — ensures lint, tests, and build pass before merge
name: CI

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The step list lives in the composite action so this workflow and
      # deploy.yml cannot drift apart again. No beacon token here: a pull-request
      # build stays out of the analytics dashboard a human reads.
      - name: Build and check
        uses: ./.github/actions/build-and-check
