# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
        env:
          # Cloudflare Web Analytics site token (public, cookieless beacon).
          # Set repo variable CF_BEACON_TOKEN to activate; unset = beacon disabled. See PRA-465.
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - name: Playwright tests
        run: bunx playwright test
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action's default is 10 minutes. On 2026-08-06 a deploy sat in
          # `deployment_queued` for the whole of it and aborted, leaving a green
          # build that never reached the site. Retrying does not recover it: a
          # Pages deployment is identified by the commit SHA, so every re-run of
          # the same commit collides with the cancelled deployment and returns
          # "Deployment cancelled" within seconds. The only clean retry is a new
          # commit, which is a poor answer to a queue simply being slow — so
          # wait longer rather than abort.
          timeout: 1800000
      # Ping IndexNow only after the site (and the key file) is live, so Bing can
      # verify the key and crawl new/changed posts within minutes. Best-effort:
      # the script always exits 0, so a submission hiccup never fails the deploy.
      - name: Submit sitemap to IndexNow
        if: success()
        run: node scripts/submit-indexnow.mjs
