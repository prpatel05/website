# CI workflow for pull requests — ensures lint, tests, and build pass before merge
name: CI

on:
  # All PRs — including stacked UX branches whose base is not main — so GitHub
  # CI can gate a stack the same way local CI does.
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.58 cannot
    # install chromium deps (Deploy run 40318246021 failed on 10/26).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The step list lives in the composite action so this workflow and
      # deploy.yml cannot drift apart again. No beacon token here: a pull-request
      # build stays out of the analytics dashboard a human reads.
      - name: Build and check
        uses: ./.github/actions/build-and-check
